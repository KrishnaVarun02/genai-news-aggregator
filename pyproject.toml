[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "genai-news-aggregator"
version = "1.0.0"
description = "Collect AI news, summarize it, rank it for a profile and preview a daily email"
requires-python = ">=3.11,<3.14"
dependencies = [
  "feedparser==6.0.11", "httpx==0.28.1", "openai==1.109.1",
  "pydantic==2.11.9", "python-dotenv==1.1.1", "SQLAlchemy==2.0.43",
  "psycopg[binary]==3.2.10", "youtube-transcript-api==1.2.2",
  "beautifulsoup4==4.13.5",
  "requests==2.34.2",
]

[project.optional-dependencies]
documents = ["docling==2.55.1"]

[dependency-groups]
dev = ["pytest==8.3.5"]

[project.scripts]
news = "news_aggregator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/news_aggregator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: local PostgreSQL and SMTP sink", "document: optional Docling conversion"]
